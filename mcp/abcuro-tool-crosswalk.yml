rest_only:
- operations: [listUsers, getUser]
  capability: author accounts
  reason: >-
    Deliberately withheld. Answers anonymously and enumerates WordPress login slugs (4 accounts);
    promoting it to an agent tool would amplify a known information-disclosure default for no
    consumer value. Recorded as a finding in conformance/abcuro-conformance.yml.
- operations: [listComments, getComment]
  capability: comments
  reason: Collection is empty and comments are not enabled anywhere on the site.
- operations: [listCategories, getCategory, listTags, getTag]
  capability: post taxonomy
  reason: >-
    One category term ("Press Release") and zero tags. No filtering value; the taxonomy is
    reachable as a parameter on listPosts if ever needed.
- operations: [listTypes, listTaxonomies, listStatuses]
  capability: schema introspection
  reason: Subsumed by describe_site_api, which returns the full route index in one call.
- operations: [getOembed]
  capability: oEmbed
  reason: Presentation-layer concern; returns an embed shell rather than content.

