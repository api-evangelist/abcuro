note: >-
  Binds every candidate MCP tool to its backing OpenAPI operation. Because the tool set was itself
  derived from the spec (Abcuro publishes no MCP server), every binding is exact and confidence is
  high throughout — there is no name-matching guesswork here, and no divergence between a published
  tool list and the contract. What this crosswalk documents instead is the deliberate coverage
  decision: which REST operations were promoted to tools and which were withheld, and why.

