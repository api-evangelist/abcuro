      redirection/v1, yoast/v1, genesis/v1, pum/v1, wp-site-health/v1 and wp-block-editor/v1
      namespaces. All require WordPress cookie+nonce or an application password, none of which are
      publicly obtainable, so none are modelled in the OpenAPI or bound here.

