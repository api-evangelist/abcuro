aid: abcuro
name: Abcuro
description: >-
  Abcuro is a clinical-stage biotechnology company headquartered in Newton, Massachusetts, developing
  first-in-class immunotherapies that precisely modulate highly cytotoxic T cells for autoimmune disease
  and cancer. Its lead candidate, ulviprubart (ABC008), is a monoclonal antibody targeting KLRG1 that
  selectively depletes highly cytotoxic T cells, evaluated in the registrational Phase 2/3 MUSCLE study
  in inclusion body myositis (IBM) and in T cell large granular lymphocytic leukemia (T-LGLL) and mature
  T and NK cell lymphomas. Abcuro publishes no commercial developer platform or product API; its only
  machine-readable surface is the public WordPress REST API behind abcuro.com, which anonymously serves
  the corporate content graph — press releases, pipeline and science pages, scientific publications,
  leadership and board people records, investor records, and media assets — and is catalogued here as a
  read-only content API rather than a product API.
