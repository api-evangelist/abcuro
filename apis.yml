apis:
- name: Abcuro Content API (WordPress REST)
  description: >-
    The public, anonymously readable WordPress REST API serving abcuro.com. It exposes the corporate
    content graph as JSON — press releases (posts), site pages, media assets, categories, and four
    Abcuro-specific custom post types: abcuro_people (leadership, team, board), abcuro_investors,
    abcuro_pubs (scientific publications) and abcuro_jobs (careers). Also exposes site-wide search,
    content types, taxonomies, statuses, and oEmbed. Read operations require no authentication; write
    operations require WordPress cookie/nonce or application-password authentication and are not
    available to the public. This is a corporate website content API, not a commercial product API.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://abcuro.com/wp-json/
