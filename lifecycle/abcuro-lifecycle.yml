change_communication:
  api_changelog: null
  corporate_news:
    url: https://abcuro.com/news/
    feed: https://abcuro.com/feed/
    api: https://abcuro.com/wp-json/wp/v2/posts
    note: >-
      The News feed carries clinical and corporate press releases (28 posts as of 2026-08-02),
      not API release notes. It is the company's change surface, not the API's, and is wired in
      apis.yml as Blog/BlogRSS rather than ChangeLog.

stability_assessment:
  surface: openapi/abcuro-content-openapi.yml
  read_surface: stable-by-inheritance
  rationale: >-
    The wp/v2 core routes (posts, pages, media, categories, tags, users, search, types, taxonomies,
    statuses) are governed by WordPress core's backward-compatibility policy and are unlikely to
    break. The four Abcuro-specific custom post types (abcuro_people, abcuro_investors, abcuro_pubs,
    abcuro_jobs) and the person_role taxonomy are registered by the site's own theme or plugin code;
    their rest_base names, ACF field sets and even their existence are entirely at Abcuro's
    discretion and could change with any site redesign without notice.
  consumer_guidance: >-
    Treat the four abcuro_* collections as unversioned and unannounced. Re-read
    https://abcuro.com/wp-json/ before each run and reconcile against the routes index rather than
    hard-coding paths.
