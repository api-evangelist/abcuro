generated: '2026-08-02'
method: probed
source: live probes of abcuro.com + openapi/abcuro-content-openapi.yml
note: >-
  Abcuro operates a corporate marketing site, not an API platform. It publishes no versioning
  policy, no deprecation policy, no SLA, no status page and no API changelog. The findings below
  are recorded as verified absences, not as gaps to be papered over. No StatusPage or Deprecation
  pointer is emitted in apis.yml because neither exists.

versioning:
  scheme: namespace-in-path
  current: wp/v2
  policy_url: null
  policy_published: false
  note: >-
    The version segment is inherited from WordPress core, not chosen by Abcuro. wp/v2 has been the
    stable core namespace since WordPress 4.7 (2016). Plugin namespaces registered on this
    deployment carry their own versions: oembed/1.0, wp-site-health/v1, wp-block-editor/v1,
    genesis/v1, yoast/v1, redirection/v1, pum/v1. A plugin being updated or removed can change or
    withdraw a namespace with no announcement.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No Sunset or Deprecation response header was observed on any probe. No operation in
    openapi/abcuro-content-openapi.yml is marked deprecated. There is no channel through which a
    breaking change to this surface would be announced.
  deprecated_operations: []

sla:
  url: null
  published: false
  uptime_target: null
  note: There is no service-level commitment of any kind. This is an unmetered, unsupported
